[theme]
base = "light"
primaryColor = "#EE4D2D"
backgroundColor = "#FFFDFC"
secondaryBackgroundColor = "#FFF3EF"
textColor = "#2B2B2B"
borderColor = "#F1D8CF"
linkColor = "#D83F20"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFF3EF"
textColor = "#2B2B2B"
borderColor = "#F1E4DE"
primaryColor = "#EE4D2D"

[server]
headless = true
address = "0.0.0.0"
port = 8501
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
